- menu: "Light/Sun"
  name: "Sun"
  order: 30
  description: "Directional sun with procedural sky lighting and shadows"
  components:
    - type: Transform
      props:
        local_euler_angles: [-45, 45, 0]
    - type: DirectionalLight
      props:
        procedural_sky_lighting: true
        cast_shadows: true

